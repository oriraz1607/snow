version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-blank: false
    govet:
      enable:
        - shadow
        - printf
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -QF1001
        - -QF1003
  exclusions:
    generated: lax
    paths:
      - node_modules
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - govet
        text: "shadow: declaration of \"err\""
