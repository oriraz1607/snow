apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noc-alert-manager-prod

resources:
  - ../../base

labels:
  - pairs:
      topology.noc-alert-manager.io/mode: single-site
      topology.noc-alert-manager.io/site: primary

patches:
  - path: patch-namespace.yaml
    target:
      version: v1
      kind: Namespace
  - path: patch-config.yaml
  - path: patch-deployment.yaml
  - path: patch-route.yaml
  - path: patch-externalsecret.yaml
