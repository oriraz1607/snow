apiVersion: batch/v1
kind: Job
metadata:
  name: noc-alert-db-migrate
  labels:
    app.kubernetes.io/name: noc-alert-migrate
    app.kubernetes.io/part-of: noc-alert-manager
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noc-alert-migrate
        app.kubernetes.io/part-of: noc-alert-manager
    spec:
      serviceAccountName: noc-alert-api
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/oriraz1607/noc-alert-api:v1.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/migrate", "-dir", "/migrations", "up"]
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noc-alert-migrate-secrets
                  key: MIGRATE_DATABASE_URL
            - name: POSTGRES_APP_USER
              valueFrom:
                configMapKeyRef:
                  name: noc-alert-api-config
                  key: POSTGRES_APP_USER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
