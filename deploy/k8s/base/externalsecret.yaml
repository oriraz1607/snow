apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: noc-alert-api-secrets
  labels:
    app.kubernetes.io/name: noc-alert-api
    app.kubernetes.io/part-of: noc-alert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: noc-alert-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: noc-alert-manager/prod/api
        property: database_url
    - secretKey: GRAFANA_PLUGIN_JWT_SECRET
      remoteRef:
        key: noc-alert-manager/prod/api
        property: grafana_plugin_jwt_secret
    - secretKey: GRAFANA_PLUGIN_JWT_SECRET_PREVIOUS
      remoteRef:
        key: noc-alert-manager/prod/api
        property: grafana_plugin_jwt_secret_previous
    - secretKey: ALERTMANAGER_WEBHOOK_TOKEN
      remoteRef:
        key: noc-alert-manager/prod/api
        property: alertmanager_webhook_token
    - secretKey: SNOW_CLIENT_ID
      remoteRef:
        key: noc-alert-manager/prod/servicenow
        property: client_id
    - secretKey: SNOW_CLIENT_SECRET
      remoteRef:
        key: noc-alert-manager/prod/servicenow
        property: client_secret
    - secretKey: SNOW_DEFAULT_NOC_CALLER_SYS_ID
      remoteRef:
        key: noc-alert-manager/prod/servicenow
        property: default_noc_caller_sys_id
    - secretKey: SNOW_INBOUND_WEBHOOK_SECRET
      remoteRef:
        key: noc-alert-manager/prod/servicenow
        property: inbound_webhook_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: noc-alert-migrate-secrets
  labels:
    app.kubernetes.io/name: noc-alert-migrate
    app.kubernetes.io/part-of: noc-alert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: noc-alert-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: MIGRATE_DATABASE_URL
      remoteRef:
        key: noc-alert-manager/prod/db-owner
        property: migrate_database_url
