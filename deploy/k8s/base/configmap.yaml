apiVersion: v1
kind: ConfigMap
metadata:
  name: noc-alert-api-config
  labels:
    app.kubernetes.io/name: noc-alert-api
    app.kubernetes.io/part-of: noc-alert-manager
data:
  PORT: "8080"
  ADMIN_PORT: "9090"
  LOG_LEVEL: "info"
  PG_MAX_CONNS: "25"
  PG_MIN_CONNS: "5"
  POSTGRES_APP_USER: "alert_api_app"
  GRAFANA_PLUGIN_JWT_ISSUER: "noc-alert-manager-app"
  GRAFANA_PUBLIC_URL: "https://grafana.example.com"
  ALLOW_LEGACY_PROXY_HEADER_AUTH: "false"
  ALERTMANAGER_MAX_PAYLOAD_BYTES: "5242880"
  SNOW_INSTANCE_URL: "https://instance.service-now.com"
  SNOW_AUTH_MODE: "oauth_client_credentials"
  SNOW_TOKEN_URL: "https://instance.service-now.com/oauth_token.do"
  SNOW_DEFAULT_NOC_CALLER_USERNAME: "noc"
  SNOW_DEFAULT_ASSIGNMENT_GROUP: "Infrastructure"
  SNOW_DEFAULT_CATEGORY: "Infrastructure"
  SNOW_HTTP_TIMEOUT_SECONDS: "15"
  SNOW_POLL_INTERVAL_SECONDS: "120"
  SNOW_AUTO_POST_RESOLVED_NOTE: "true"
  SNOW_NOTE_WORKER_INTERVAL_SECONDS: "15"
  SNOW_AUTO_REOPEN_COOLDOWN_SECONDS: "300"
  SNOW_AUTO_REOPEN_MAX_ATTEMPTS: "3"
  ALLOW_RETROSPECTIVE_INCIDENT_CREATE: "false"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_API_RPS: "60"
  RATE_LIMIT_API_BURST: "120"
  RATE_LIMIT_WEBHOOK_RPS: "30"
  RATE_LIMIT_WEBHOOK_BURST: "60"
  TRUST_PROXY_HEADERS: "true"
  CORS_ALLOWED_ORIGINS: ""
  CONFLUENCE_ALLOWED_HOSTS: ""
