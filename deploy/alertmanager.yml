global:
  resolve_timeout: 5m

route:
  receiver: "alert-api"
  group_by: ["alertname", "cluster"]
  group_wait: 1s
  group_interval: 2s
  repeat_interval: 1h

receivers:
  - name: "alert-api"
    webhook_configs:
      - url: "http://api:8080/api/v1/webhooks/alertmanager"
        send_resolved: true
        max_alerts: 0
        http_config:
          bearer_token_file: "/tmp/webhook_token"
