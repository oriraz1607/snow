apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: noc-alert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: NOC Alert Manager Platform (Grafana + ServiceNow integration)
  sourceRepos:
    - https://github.com/oriraz1607/snow.git
  destinations:
    - namespace: "noc-alert-manager*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: route.openshift.io
      kind: Route
    - group: external-secrets.io
      kind: ExternalSecret
