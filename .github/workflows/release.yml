name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional semantic version tag (e.g. v1.1.0)
        required: false
        default: ''
      push_registry:
        description: Push API container image to configured registry
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  api-image:
    name: Build API Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta_version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.version_tag }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_VALUE#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA_VALUE:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_IMAGE || format('ghcr.io/{0}/noc-alert-api', github.repository_owner) }}
          tags: |
            type=raw,value=${{ steps.meta_version.outputs.tag }}
            type=sha,prefix=sha-

      - name: Build API container tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/noc-alert-api-image.tar

      - name: Generate tarball checksum
        run: |
          sha256sum /tmp/noc-alert-api-image.tar > /tmp/noc-alert-api-image.tar.sha256

      - name: Upload API container image artifact
        uses: actions/upload-artifact@v4
        with:
          name: noc-alert-api-image-${{ steps.meta_version.outputs.tag }}
          path: |
            /tmp/noc-alert-api-image.tar
            /tmp/noc-alert-api-image.tar.sha256

      - name: Log in to container registry (when push enabled)
        if: ${{ inputs.push_registry || (startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_REGISTRY_PUSH == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push API container image (when push enabled)
        if: ${{ inputs.push_registry || (startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_REGISTRY_PUSH == 'true') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  grafana-plugin:
    name: Build Multi-Arch Grafana Plugin Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Install plugin frontend dependencies
        working-directory: plugin
        run: npm ci

      - name: Package multi-arch plugin bundle
        env:
          OUTPUT_DIR: ${{ runner.temp }}/plugin-artifacts
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          GRAFANA_PLUGIN_ROOT_URLS: ${{ vars.GRAFANA_PLUGIN_ROOT_URLS }}
        run: |
          chmod +x plugin/scripts/package-plugin.sh
          plugin/scripts/package-plugin.sh

      - name: Upload Grafana plugin archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: noc-alert-manager-app-plugin
          path: |
            ${{ runner.temp }}/plugin-artifacts/*.zip
            ${{ runner.temp }}/plugin-artifacts/*.sha256
