name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: backend
          args: --config ../.golangci.yml ./...

      - name: Run golangci-lint (integration build tag)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: backend
          args: --config ../.golangci.yml --build-tags=integration ./tests/integration/...

      - name: Run go vet and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go test -race -v ./...

  plugin-go:
    name: Plugin Go Proxy Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: plugin
          args: --config ../.golangci.yml ./pkg/...

      - name: Run go vet and unit tests
        working-directory: plugin
        run: |
          go vet ./pkg/...
          go test -race -v ./pkg/...

  plugin-frontend:
    name: Plugin Frontend Lint, Typecheck, Tests & React 19 Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: plugin
        run: npm ci

      - name: Run ESLint
        working-directory: plugin
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Run unit tests
        working-directory: plugin
        run: npm test -- --watchAll=false

      - name: Build production plugin bundle
        working-directory: plugin
        run: npm run build

      - name: Verify Grafana 13 / React 19 compatibility
        working-directory: plugin
        run: npx -y @grafana/react-detect@latest

  integration:
    name: E2E Integration (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs:
      - backend
      - plugin-go
      - plugin-frontend
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 15-alpine
          - 16-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate ephemeral CI test env file
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ci.env" <<'EOF'
          POSTGRES_DB=alert_manager
          POSTGRES_USER=alert_owner
          POSTGRES_PASSWORD=ci-owner-pass
          POSTGRES_APP_USER=alert_api_app
          POSTGRES_APP_PASSWORD=ci-app-pass
          DATABASE_URL=postgres://alert_api_app:ci-app-pass@postgres:5432/alert_manager?sslmode=disable
          MIGRATE_DATABASE_URL=postgres://alert_owner:ci-owner-pass@postgres:5432/alert_manager?sslmode=disable
          PORT=8080
          ADMIN_PORT=9090
          LOG_LEVEL=info
          GRAFANA_PLUGIN_JWT_SECRET=ci-plugin-jwt-secret-min-32-characters
          GRAFANA_PLUGIN_JWT_ISSUER=noc-alert-manager-app
          GRAFANA_PUBLIC_URL=http://localhost:3000
          ALLOW_LEGACY_PROXY_HEADER_AUTH=false
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD=ci-grafana-admin-pass
          ALERTMANAGER_WEBHOOK_TOKEN=ci-alertmanager-webhook-token
          SNOW_INSTANCE_URL=http://mocksnow:8085
          SNOW_AUTH_MODE=oauth_client_credentials
          SNOW_TOKEN_URL=http://mocksnow:8085/oauth_token.do
          SNOW_CLIENT_ID=ci-snow-client
          SNOW_CLIENT_SECRET=ci-snow-secret
          SNOW_DEFAULT_NOC_CALLER_SYS_ID=00000000000000000000000000000noc
          SNOW_DEFAULT_NOC_CALLER_USERNAME=noc
          SNOW_DEFAULT_ASSIGNMENT_GROUP=Infrastructure
          SNOW_DEFAULT_CATEGORY=Infrastructure
          SNOW_INBOUND_WEBHOOK_SECRET=ci-snow-webhook-secret
          SNOW_HTTP_TIMEOUT_SECONDS=2
          SNOW_POLL_INTERVAL_SECONDS=2
          SNOW_AUTO_POST_RESOLVED_NOTE=true
          SNOW_NOTE_WORKER_INTERVAL_SECONDS=1
          RATE_LIMIT_ENABLED=false
          EOF

      - name: Start PostgreSQL (${{ matrix.postgres }}), Migrate & Test Stack
        env:
          POSTGRES_IMAGE: docker.io/library/postgres:${{ matrix.postgres }}
          COMPOSE_PROJECT_NAME: snow-ci-${{ matrix.postgres }}
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f deploy/docker-compose.yml up -d --build postgres migrate mocksnow api alertmanager

      - name: Verify 01-init-app-role.sh & Full Up/Down/Up Migration Cycle
        env:
          POSTGRES_IMAGE: docker.io/library/postgres:${{ matrix.postgres }}
          COMPOSE_PROJECT_NAME: snow-ci-${{ matrix.postgres }}
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f deploy/docker-compose.yml exec -T postgres \
            psql -U alert_owner -d alert_manager -tAc "SELECT rolname FROM pg_roles WHERE rolname = 'alert_api_app'" | grep -qx 'alert_api_app'

          docker compose --env-file "$RUNNER_TEMP/ci.env" -f deploy/docker-compose.yml run --rm --no-deps --entrypoint /bin/sh migrate -c '
            set -e
            for i in 1 2 3 4 5 6 7; do
              /bin/migrate -dir /migrations down
            done
            /bin/migrate -dir /migrations up
          '

      - name: Run Integration Test Suite (-tags integration)
        working-directory: backend
        env:
          GRAFANA_PLUGIN_JWT_SECRET: ci-plugin-jwt-secret-min-32-characters
          GRAFANA_PLUGIN_JWT_ISSUER: noc-alert-manager-app
          ALERTMANAGER_WEBHOOK_TOKEN: ci-alertmanager-webhook-token
          SNOW_DEFAULT_NOC_CALLER_SYS_ID: 00000000000000000000000000000noc
          INTEGRATION_API_URL: http://127.0.0.1:8080
          INTEGRATION_ADMIN_URL: http://127.0.0.1:9090
          INTEGRATION_MOCKSNOW_URL: http://127.0.0.1:8085
          INTEGRATION_ALERTMANAGER_URL: http://127.0.0.1:9093
          INTEGRATION_APP_DATABASE_URL: postgres://alert_api_app:ci-app-pass@127.0.0.1:5432/alert_manager?sslmode=disable
          INTEGRATION_OWNER_DATABASE_URL: postgres://alert_owner:ci-owner-pass@127.0.0.1:5432/alert_manager?sslmode=disable
        run: go test -tags integration -v ./tests/integration/...

      - name: Dump logs on failure
        if: failure()
        env:
          POSTGRES_IMAGE: docker.io/library/postgres:${{ matrix.postgres }}
          COMPOSE_PROJECT_NAME: snow-ci-${{ matrix.postgres }}
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" -f deploy/docker-compose.yml logs --no-color

      - name: Tear down stack and clean up
        if: always()
        env:
          POSTGRES_IMAGE: docker.io/library/postgres:${{ matrix.postgres }}
          COMPOSE_PROJECT_NAME: snow-ci-${{ matrix.postgres }}
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f deploy/docker-compose.yml down -v
          rm -f "$RUNNER_TEMP/ci.env"
